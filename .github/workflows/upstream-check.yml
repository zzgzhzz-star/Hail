name: Upstream check

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Hail and GKD upstream commits
        shell: pwsh
        run: ./scripts/check-upstreams.ps1
